<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural FPS Engine - Hordes of Fast Enemies</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #fff; }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        #hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
            z-index: 10; text-shadow: 2px 2px 0px #000;
        }
        #stats { position: absolute; bottom: 20px; left: 20px; font-size: 22px; background: rgba(10,10,15,0.7); padding: 15px; border-left: 5px solid #00ffcc; font-weight: bold; }
        #weapon-info { position: absolute; bottom: 20px; right: 20px; text-align: right; font-size: 22px; background: rgba(10,10,15,0.7); padding: 15px; border-right: 5px solid #ffaa00; font-weight: bold; }
        
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #00ffcc;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 10; border-radius: 50%;
            transition: background 0.05s, transform 0.05s;
        }
        #crosshair.hit { background: #ff3333; transform: translate(-50%, -50%) scale(1.5); }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(0, 255, 204, 0.6); }
        #crosshair::before { top: 6px; left: -6px; width: 16px; height: 2px; }
        #crosshair::after { top: -6px; left: 6px; width: 2px; height: 16px; }

        #damage-flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 30%, rgba(255,0,0,0.6) 100%);
            opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.1s;
        }

        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #222 0%, #000 100%); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 20; cursor: pointer;
        }
        #start-screen h1 { font-size: 50px; letter-spacing: 5px; color: #ff5555; margin-bottom: 10px; text-align: center; }
        #start-screen p { font-size: 18px; color: #ccc; margin-bottom: 30px; text-align: center; line-height: 1.8; }
        .btn { padding: 15px 30px; border: 2px solid #ff5555; color: #ff5555; background: transparent; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: #ff5555; color: #000; box-shadow: 0 0 20px #ff5555; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="damage-flash"></div>
    <div id="crosshair"></div>

    <div id="hud">
        <div id="stats">
            HP: <span id="hp" style="color:#ff5555">100</span><br>
            KILLS: <span id="score">0</span>
        </div>
        <div id="weapon-info">
            <span id="gun-name">AK-47 ASSAULT</span><br>
            AMMO: <span id="ammo">30</span>
        </div>
    </div>

    <div id="start-screen">
        <h1>FAST ENEMY HORDE</h1>
        <p>
            [W A S D] Move | [SHIFT] Sprint <br>
            [Mouse] Aim & Shoot | [R] Reload <br>
            [1] Python | [2] Plasma | [3] AK-47
        </p>
        <button class="btn">SURVIVE THE HORDE</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. PROCEDURAL TEXTURE GENERATION ---
        function generateTexture(type) {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');

            if (type === 'wall') {
                ctx.fillStyle = '#2c2c30'; ctx.fillRect(0, 0, size, size);
                for (let i = 0; i < 40000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#36363b' : '#1a1a1f';
                    ctx.fillRect(Math.random() * size, Math.random() * size, 2, 2);
                }
                ctx.strokeStyle = '#111'; ctx.lineWidth = 6;
                for(let i=0; i<=size; i+=128) {
                    ctx.strokeRect(i, 0, 128, size);
                    ctx.strokeRect(0, i, size, 128);
                }
            } else if (type === 'floor') {
                ctx.fillStyle = '#1f1f1f'; ctx.fillRect(0, 0, size, size);
                ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
                for(let i=0; i<size; i+=32) {
                    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, size); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(size, i); ctx.stroke();
                }
            } else if (type === 'wood') {
                ctx.fillStyle = '#6e3518'; ctx.fillRect(0, 0, size, size);
                for (let i = 0; i < 2000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#52250d' : '#8a431f';
                    ctx.fillRect(0, Math.random() * size, size, Math.random() * 4 + 1);
                }
            } else if (type === 'metal') {
                ctx.fillStyle = '#444'; ctx.fillRect(0, 0, size, size);
                for (let i = 0; i < 50000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#555' : '#333';
                    ctx.fillRect(Math.random() * size, Math.random() * size, 1, 3);
                }
            } else if (type === 'flesh') {
                ctx.fillStyle = '#5c3535'; ctx.fillRect(0, 0, size, size);
                for (let i = 0; i < 30000; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#4a2828' : '#734242';
                    ctx.beginPath(); ctx.arc(Math.random() * size, Math.random() * size, Math.random()*3, 0, Math.PI*2); ctx.fill();
                }
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const texWall = generateTexture('wall'); texWall.repeat.set(1, 1);
        const texFloor = generateTexture('floor'); texFloor.repeat.set(32, 32);
        const matWall = new THREE.MeshLambertMaterial({ map: texWall });
        const matFloor = new THREE.MeshLambertMaterial({ map: texFloor });
        const matMetal = new THREE.MeshLambertMaterial({ map: generateTexture('metal') });
        const matWood = new THREE.MeshLambertMaterial({ map: generateTexture('wood') });
        const matFlesh = new THREE.MeshLambertMaterial({ map: generateTexture('flesh') });

        // --- 2. AUDIO SYNTHESIS ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'ak' || type === 'python') {
                const isAK = type === 'ak';
                const bufferSize = audioCtx.sampleRate * (isAK ? 0.2 : 0.4);
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (isAK ? 0.8 : 1.2);
                
                const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.setValueAtTime(isAK ? 1800 : 1200, now);
                filter.frequency.exponentialRampToValueAtTime(50, now + (isAK ? 0.2 : 0.4));
                
                const gain = audioCtx.createGain(); gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + (isAK ? 0.2 : 0.4));
                
                noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'plasma') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(900, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.15);
                gain.gain.setValueAtTime(0.5, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'footstep') {
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + 0.08);
            }
        }

        // --- 3. SCENE & MAP SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a10, 0.025);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const MAP_SIZE = 24; const UNIT = 8;
        const grid = Array.from({length: MAP_SIZE}, () => Array(MAP_SIZE).fill(0));
        
        for(let r=0; r<MAP_SIZE; r++) {
            for(let c=0; c<MAP_SIZE; c++) {
                if(r===0 || c===0 || r===MAP_SIZE-1 || c===MAP_SIZE-1) grid[r][c] = 1;
                else if(Math.random() > 0.75) grid[r][c] = 1;
            }
        }
        
        for(let r=1; r<=4; r++) {
            for(let c=1; c<=4; c++) {
                grid[r][c] = 0;
            }
        }

        const floorGeo = new THREE.PlaneGeometry(MAP_SIZE*UNIT, MAP_SIZE*UNIT);
        const floor = new THREE.Mesh(floorGeo, matFloor);
        floor.rotation.x = -Math.PI/2; floor.position.set((MAP_SIZE*UNIT)/2, 0, (MAP_SIZE*UNIT)/2);
        scene.add(floor);
        
        const ceil = floor.clone(); ceil.position.y = UNIT; ceil.rotation.x = Math.PI/2; scene.add(ceil);

        const wallGeo = new THREE.BoxGeometry(UNIT, UNIT, UNIT);
        for(let r=0; r<MAP_SIZE; r++) {
            for(let c=0; c<MAP_SIZE; c++) {
                if(grid[r][c] === 1) {
                    const w = new THREE.Mesh(wallGeo, matWall);
                    w.position.set(c*UNIT + UNIT/2, UNIT/2, r*UNIT + UNIT/2);
                    scene.add(w);
                }
            }
        }
        
        scene.add(new THREE.AmbientLight(0x555566, 0.6));

        const flashlight = new THREE.SpotLight(0xffffff, 1.2, 50, Math.PI/3, 0.5, 1);
        flashlight.position.set(0, 0, 0);
        flashlight.target.position.set(0, 0, -1);
        camera.add(flashlight);
        camera.add(flashlight.target);

        // --- 4. HIGH-DETAIL PROCEDURAL WEAPONS ---
        const weaponGroup = new THREE.Group(); camera.add(weaponGroup); scene.add(camera);
        
        const pythonGroup = new THREE.Group();
        const pBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.6, 16), matMetal); pBarrel.rotation.x = Math.PI/2; pBarrel.position.set(0, 0, -0.5);
        const pGrip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.25, 0.12), matWood); pGrip.position.set(0, -0.18, 0.02); pGrip.rotation.x = Math.PI/5;
        pythonGroup.add(pBarrel, pGrip); pythonGroup.position.set(0.3, -0.25, -0.5); pythonGroup.visible = false;

        const plasmaGroup = new THREE.Group();
        const plBody = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, 0.8), matMetal); plBody.position.z = -0.4;
        const plCore = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.6, 16), new THREE.MeshBasicMaterial({color:0x00ffcc})); plCore.rotation.x = Math.PI/2; plCore.position.set(0, 0.05, -0.4);
        plasmaGroup.add(plBody, plCore); plasmaGroup.position.set(0.3, -0.25, -0.5); plasmaGroup.visible = false;

        const akGroup = new THREE.Group();
        const akReceiver = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.15, 0.4), matMetal); akReceiver.position.set(0, 0, 0);
        const akBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.7, 16), matMetal); akBarrel.rotation.x = Math.PI/2; akBarrel.position.set(0, 0.02, -0.55);
        const akGas = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.3, 16), matMetal); akGas.rotation.x = Math.PI/2; akGas.position.set(0, 0.05, -0.35);
        const akHandguard = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.08, 0.25), matWood); akHandguard.position.set(0, 0.02, -0.35);
        const akStock = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.12, 0.35), matWood); akStock.position.set(0, -0.05, 0.35); akStock.rotation.x = 0.1;
        const akGrip = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.08), matMetal); akGrip.position.set(0, -0.15, 0.15); akGrip.rotation.x = -Math.PI/10;
        const mag1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.08), matMetal); mag1.position.set(0, -0.12, -0.1); mag1.rotation.x = 0.2;
        const mag2 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.15, 0.08), matMetal); mag2.position.set(0, -0.24, -0.06); mag2.rotation.x = 0.4;
        akGroup.add(akReceiver, akBarrel, akGas, akHandguard, akStock, akGrip, mag1, mag2);
        akGroup.position.set(0.35, -0.3, -0.6);

        weaponGroup.add(pythonGroup, plasmaGroup, akGroup);
        const muzzleLight = new THREE.PointLight(0xffdd00, 0, 15); muzzleLight.position.set(0.35, -0.2, -1.2); camera.add(muzzleLight);

        // --- 5. ARTICULATED ENEMIES & HORDE SPAWNING ---
        const enemies = [];
        const MAX_ENEMIES = 35; // Increased max enemy count for a true horde

        function createEnemyLimbs() {
            const eGroup = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.2, 0.6), matFlesh); torso.position.y = 1.6;
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.7), matFlesh); head.position.y = 2.6;
            const eyeL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 0.1), new THREE.MeshBasicMaterial({color:0xff0000})); eyeL.position.set(-0.2, 2.7, 0.36);
            const eyeR = eyeL.clone(); eyeR.position.set(0.2, 2.7, 0.36);
            const eyeLight = new THREE.PointLight(0xff0000, 1.2, 5); eyeLight.position.set(0, 2.7, 0.5);

            const armL = new THREE.Group(); armL.position.set(-0.6, 2.0, 0);
            const armLMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), matFlesh); armLMesh.position.y = -0.5; armL.add(armLMesh);
            
            const armR = new THREE.Group(); armR.position.set(0.6, 2.0, 0);
            const armRMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), matFlesh); armRMesh.position.y = -0.5; armR.add(armRMesh);

            const legL = new THREE.Group(); legL.position.set(-0.25, 1.0, 0);
            const legLMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.0, 0.35), matFlesh); legLMesh.position.y = -0.5; legL.add(legLMesh);

            const legR = new THREE.Group(); legR.position.set(0.25, 1.0, 0);
            const legRMesh = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.0, 0.35), matFlesh); legRMesh.position.y = -0.5; legR.add(legRMesh);

            eGroup.add(torso, head, eyeL, eyeR, eyeLight, armL, armR, legL, legR);
            // Blazing fast speed setup
            eGroup.userData = { hp: 100, alive: true, speed: 0.15 + Math.random()*0.08, armL, armR, legL, legR, animOffset: Math.random() * Math.PI * 2 };
            return eGroup;
        }

        function trySpawnEnemy() {
            if(enemies.filter(e => e.userData.alive).length >= MAX_ENEMIES) return;
            let r = Math.floor(Math.random() * MAP_SIZE), c = Math.floor(Math.random() * MAP_SIZE);
            if(grid[r][c] === 1) return;

            const ex = c * UNIT + UNIT/2, ez = r * UNIT + UNIT/2;
            if(Math.hypot(ex - player.pos.x, ez - player.pos.z) < UNIT * 2.5) return;

            const enemy = createEnemyLimbs();
            enemy.position.set(ex, 0, ez);
            scene.add(enemy); enemies.push(enemy);
        }
        
        // Spawn initial horde instantly
        for(let i=0; i<25; i++) {
            let r = Math.floor(Math.random() * MAP_SIZE), c = Math.floor(Math.random() * MAP_SIZE);
            if(grid[r][c] !== 1 && Math.hypot((c*UNIT + UNIT/2) - (2.5*UNIT), (r*UNIT + UNIT/2) - (2.5*UNIT)) > UNIT * 2) {
                const enemy = createEnemyLimbs();
                enemy.position.set(c * UNIT + UNIT/2, 0, r * UNIT + UNIT/2);
                scene.add(enemy); enemies.push(enemy);
            }
        }
        setInterval(trySpawnEnemy, 600); // Rapid continuous spawns

        // --- 6. PLAYER CONTROLS & FOOTSTEPS ---
        const player = {
            pos: new THREE.Vector3(2.5*UNIT, 2, 2.5*UNIT),
            hp: 100, score: 0, gun: 3, ammo: { 1: 6, 2: 40, 3: 30 }, maxAmmo: { 1: 6, 2: 40, 3: 30 }, reloading: false
        };
        camera.position.copy(player.pos);

        let keys = { w:false, a:false, s:false, d:false, shift:false };
        let pitch = 0, yaw = 0, isLocked = false, recoilAmount = 0, autoFireTimer = 0;
        let footstepTimer = 0;

        document.getElementById('start-screen').addEventListener('click', () => document.body.requestPointerLock());
        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === document.body;
            document.getElementById('start-screen').style.display = isLocked ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', e => {
            if(!isLocked) return;
            yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002;
            pitch = Math.max(-Math.PI/2.1, Math.min(Math.PI/2.1, pitch));
        });

        document.addEventListener('keydown', e => {
            if(!isLocked) return;
            const code = e.code.toLowerCase().replace('key', '');
            if(keys.hasOwnProperty(code)) keys[code] = true;
            if(e.code === 'ShiftLeft') keys.shift = true;
            if(e.code === 'Digit1') switchGun(1);
            if(e.code === 'Digit2') switchGun(2);
            if(e.code === 'Digit3') switchGun(3);
            if(e.code === 'KeyR') reload();
        });
        document.addEventListener('keyup', e => {
            const code = e.code.toLowerCase().replace('key', '');
            if(keys.hasOwnProperty(code)) keys[code] = false;
            if(e.code === 'ShiftLeft') keys.shift = false;
        });

        function switchGun(id) {
            if(player.reloading) return;
            player.gun = id;
            pythonGroup.visible = (id === 1); plasmaGroup.visible = (id === 2); akGroup.visible = (id === 3);
            const names = {1:'PYTHON .357', 2:'PLASMA RIFLE', 3:'AK-47 ASSAULT'};
            document.getElementById('gun-name').innerText = names[id];
            updateUI();
        }

        function reload() {
            if(player.reloading || player.ammo[player.gun] === player.maxAmmo[player.gun]) return;
            player.reloading = true;
            document.getElementById('ammo').innerText = "RELOADING...";
            weaponGroup.rotation.x = -Math.PI/4;
            setTimeout(() => {
                player.ammo[player.gun] = player.maxAmmo[player.gun];
                player.reloading = false;
                weaponGroup.rotation.x = 0;
                updateUI();
            }, player.gun === 3 ? 1800 : 1200);
        }

        function updateUI() {
            if(!player.reloading) document.getElementById('ammo').innerText = player.ammo[player.gun];
            document.getElementById('hp').innerText = player.hp;
            document.getElementById('score').innerText = player.score;
        }

        // --- 7. SHOOTING & HIT DETECTION ---
        let isMouseDown = false;
        document.addEventListener('mousedown', e => { if(e.button === 0 && isLocked) isMouseDown = true; });
        document.addEventListener('mouseup', e => { if(e.button === 0) isMouseDown = false; });

        const raycaster = new THREE.Raycaster();
        
        function fireWeapon() {
            if(player.reloading || player.ammo[player.gun] <= 0) {
                if(player.ammo[player.gun] <= 0) reload(); return;
            }
            player.ammo[player.gun]--; updateUI();

            let dmg = 0, sound = '', color = 0, rcl = 0;
            if(player.gun === 1) { dmg = 65; sound = 'python'; color = 0xffaa00; rcl = 0.3; }
            if(player.gun === 2) { dmg = 25; sound = 'plasma'; color = 0x00ffcc; rcl = 0.1; }
            if(player.gun === 3) { dmg = 35; sound = 'ak'; color = 0xffdd00; rcl = 0.12; }

            playSound(sound); recoilAmount = rcl;
            muzzleLight.color.setHex(color); muzzleLight.intensity = 4;
            setTimeout(() => muzzleLight.intensity = 0, 40);

            raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
            let targets = [];
            enemies.forEach(e => { if(e.userData.alive) targets.push(...e.children); });
            
            const hits = raycaster.intersectObjects(targets);
            if(hits.length > 0) {
                const cross = document.getElementById('crosshair');
                cross.classList.add('hit');
                setTimeout(() => cross.classList.remove('hit'), 100);

                const enemyGroup = hits[0].object.parent.parent === scene ? hits[0].object.parent : hits[0].object.parent.parent;
                if(enemyGroup && enemyGroup.userData) {
                    enemyGroup.userData.hp -= dmg;
                    if(enemyGroup.userData.hp <= 0 && enemyGroup.userData.alive) {
                        enemyGroup.userData.alive = false; player.score++; updateUI();
                        enemyGroup.children.forEach(c => c.material = new THREE.MeshLambertMaterial({color:0x333333}));
                        enemyGroup.rotation.x = -Math.PI/2; enemyGroup.position.y = 0.5;
                        setTimeout(() => { 
                            scene.remove(enemyGroup); 
                            const index = enemies.indexOf(enemyGroup);
                            if(index > -1) enemies.splice(index, 1);
                        }, 3000);
                    }
                }
            }
        }

        function isWallAt(x, z) {
            const buf = 1.5; 
            const pts = [ {x: x-buf, z: z-buf}, {x: x+buf, z: z-buf}, {x: x-buf, z: z+buf}, {x: x+buf, z: z+buf} ];
            for(let p of pts) {
                let r = Math.floor(p.z/UNIT), c = Math.floor(p.x/UNIT);
                if(r<0 || r>=MAP_SIZE || c<0 || c>=MAP_SIZE || grid[r][c] === 1) return true;
            }
            return false;
        }

        // --- 8. MAIN ENGINE LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta(), time = clock.getElapsedTime();

            if (isLocked) {
                camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;

                const fwd = new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
                const side = new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0), yaw);
                const dir = new THREE.Vector3();
                if(keys.w) dir.add(fwd); if(keys.s) dir.sub(fwd);
                if(keys.a) dir.sub(side); if(keys.d) dir.add(side);
                dir.normalize();

                const speed = (keys.shift ? 18.0 : 9.0) * delta;
                if(dir.length() > 0) {
                    const nx = player.pos.x + dir.x * speed, nz = player.pos.z + dir.z * speed;
                    if(!isWallAt(nx, player.pos.z)) player.pos.x = nx;
                    if(!isWallAt(player.pos.x, nz)) player.pos.z = nz;
                    camera.position.y = 2 + Math.sin(time * (keys.shift?15:10)) * 0.15;

                    footstepTimer += delta * (keys.shift ? 1.5 : 1.0);
                    if(footstepTimer >= 0.4) {
                        playSound('footstep');
                        footstepTimer = 0;
                    }
                }
                camera.position.x = player.pos.x; camera.position.z = player.pos.z;

                if(isMouseDown) {
                    autoFireTimer -= delta;
                    if(autoFireTimer <= 0) {
                        fireWeapon();
                        if(player.gun === 1) isMouseDown = false; 
                        else if(player.gun === 2) autoFireTimer = 0.15;
                        else if(player.gun === 3) autoFireTimer = 0.09;
                    }
                } else { autoFireTimer = 0; }

                if(!player.reloading) {
                    if(recoilAmount > 0) { weaponGroup.rotation.x = recoilAmount; recoilAmount -= delta * 1.5; } 
                    else { weaponGroup.rotation.x = 0; }
                }

                enemies.forEach(e => {
                    if (e.userData.alive) {
                        const toPlayer = new THREE.Vector3().subVectors(player.pos, e.position);
                        toPlayer.y = 0; const dist = toPlayer.length(); toPlayer.normalize();
                        e.lookAt(player.pos.x, e.position.y, player.pos.z);

                        if(dist > 1.8 && dist < 45) {
                            e.position.addScaledVector(toPlayer, e.userData.speed);
                            const walkCycle = Math.sin(time * 22 + e.userData.animOffset);
                            e.userData.armL.rotation.x = walkCycle * 1.1; e.userData.armR.rotation.x = -walkCycle * 1.1;
                            e.userData.legL.rotation.x = -walkCycle * 1.1; e.userData.legR.rotation.x = walkCycle * 1.1;
                        } else if(dist <= 1.8) {
                            e.userData.armL.rotation.x = -Math.PI/2; e.userData.armR.rotation.x = -Math.PI/2;
                            if(Math.random() < 0.12) {
                                player.hp -= 12; updateUI();
                                document.getElementById('damage-flash').style.opacity = '1';
                                setTimeout(() => document.getElementById('damage-flash').style.opacity = '0', 100);
                                if(player.hp <= 0) { alert(`SIMULATION OVER. \nYOU WERE OVERRUN! \nKILLS: ${player.score}`); location.reload(); }
                            }
                        }
                    }
                });
            }
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
